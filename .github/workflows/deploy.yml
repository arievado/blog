name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          PUBLIC_SITE_URL: https://arievado.github.io/blog
          PUBLIC_GISCUS_REPO: arievado/blog
          PUBLIC_GISCUS_REPO_ID: R_kgDOSZT79A
          PUBLIC_GISCUS_CATEGORY: Announcements
          PUBLIC_GISCUS_CATEGORY_ID: DIC_kwDOSZT79M4C8t3P

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
